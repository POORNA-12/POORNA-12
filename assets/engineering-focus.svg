<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#070d1c"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2246" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09142b" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="card-dist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b184a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0e2e" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="card-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092d3f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#071b2b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Connector Gradients -->
    <linearGradient id="connector-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="connector-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="connector-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="bottom-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="bottom-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="bottom-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter for Nodes -->
    <filter id="glow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#475569" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-base { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title-text { font-weight: 800; font-size: 15px; letter-spacing: 2px; }
    .card-title { font-weight: 750; font-size: 15px; letter-spacing: 0.5px; fill: #f8fafc; }
    .card-item { font-weight: 500; font-size: 13px; fill: #cbd5e1; }
    .output-text { font-weight: 850; font-size: 15.5px; letter-spacing: 2px; fill: #34d399; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="938" height="488" rx="18" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="938" height="488" rx="18" fill="url(#dot-grid)"/>

  <!-- Top Connectors -->
  <path d="M 470 74 C 470 102, 185 96, 185 125" fill="none" stroke="url(#connector-blue)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 470 74 L 470 125" fill="none" stroke="url(#connector-indigo)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 470 74 C 470 102, 755 96, 755 125" fill="none" stroke="url(#connector-cyan)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

  <!-- Bottom Connectors -->
  <path d="M 185 315 C 185 365, 470 355, 470 395" fill="none" stroke="url(#bottom-blue)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 470 315 L 470 395" fill="none" stroke="url(#bottom-indigo)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 755 315 C 755 365, 470 355, 470 395" fill="none" stroke="url(#bottom-cyan)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

  <!-- Top Node: Platform Engineering -->
  <g transform="translate(310, 24)">
    <rect x="0" y="0" width="320" height="50" rx="25" fill="#0b1733" stroke="#38bdf8" stroke-width="2" filter="url(#glow-subtle)"/>
    <rect x="0" y="0" width="320" height="50" rx="25" fill="#0b1733" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="30" cy="25" r="11" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="30" y="30" class="font-base" font-size="13" text-anchor="middle" fill="#38bdf8">⚡</text>
    <text x="175" y="30.5" class="font-base title-text" fill="#38bdf8" text-anchor="middle">PLATFORM ENGINEERING</text>
  </g>

  <!-- CARD 1: Backend Systems -->
  <g transform="translate(55, 125)">
    <rect x="0" y="0" width="260" height="190" rx="14" fill="url(#card-backend)" stroke="#3b82f6" stroke-width="1.6" stroke-opacity="0.65"/>
    <path d="M 14 0 L 246 0" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Title Area -->
    <circle cx="30" cy="30" r="14" fill="#3b82f6" fill-opacity="0.25"/>
    <text x="30" y="35" class="font-base" font-size="14.5" text-anchor="middle">🏗️</text>
    <text x="54" y="35.5" class="font-base card-title">BACKEND SYSTEMS</text>

    <line x1="18" y1="56" x2="242" y2="56" stroke="#334155" stroke-width="1"/>

    <!-- Items -->
    <circle cx="28" cy="78" r="3" fill="#3b82f6"/>
    <text x="40" y="82.5" class="font-base card-item">High-Throughput REST APIs</text>

    <circle cx="28" cy="104" r="3" fill="#3b82f6"/>
    <text x="40" y="108.5" class="font-base card-item">Django / DRF &amp; Ninja Architecture</text>

    <circle cx="28" cy="130" r="3" fill="#3b82f6"/>
    <text x="40" y="134.5" class="font-base card-item">PostgreSQL &amp; Redis Caching</text>

    <circle cx="28" cy="156" r="3" fill="#3b82f6"/>
    <text x="40" y="160.5" class="font-base card-item">ASGI Async Execution &amp; WS</text>
  </g>

  <!-- CARD 2: Distributed Systems -->
  <g transform="translate(340, 125)">
    <rect x="0" y="0" width="260" height="190" rx="14" fill="url(#card-dist)" stroke="#6366f1" stroke-width="1.6" stroke-opacity="0.65"/>
    <path d="M 14 0 L 246 0" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Title Area -->
    <circle cx="30" cy="30" r="14" fill="#6366f1" fill-opacity="0.25"/>
    <text x="30" y="35" class="font-base" font-size="14.5" text-anchor="middle">🌐</text>
    <text x="54" y="35.5" class="font-base card-title">DISTRIBUTED SYSTEMS</text>

    <line x1="18" y1="56" x2="242" y2="56" stroke="#334155" stroke-width="1"/>

    <!-- Items -->
    <circle cx="28" cy="78" r="3" fill="#6366f1"/>
    <text x="40" y="82.5" class="font-base card-item">Runtime Execution &amp; Orchestration</text>

    <circle cx="28" cy="104" r="3" fill="#6366f1"/>
    <text x="40" y="108.5" class="font-base card-item">Event-Driven Architecture</text>

    <circle cx="28" cy="130" r="3" fill="#6366f1"/>
    <text x="40" y="134.5" class="font-base card-item">Distributed Locks &amp; Load Balancing</text>

    <circle cx="28" cy="156" r="3" fill="#6366f1"/>
    <text x="40" y="160.5" class="font-base card-item">Fault Tolerance &amp; Observability</text>
  </g>

  <!-- CARD 3: Security & IAM -->
  <g transform="translate(625, 125)">
    <rect x="0" y="0" width="260" height="190" rx="14" fill="url(#card-sec)" stroke="#06b6d4" stroke-width="1.6" stroke-opacity="0.65"/>
    <path d="M 14 0 L 246 0" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Title Area -->
    <circle cx="30" cy="30" r="14" fill="#06b6d4" fill-opacity="0.25"/>
    <text x="30" y="35" class="font-base" font-size="14.5" text-anchor="middle">🔐</text>
    <text x="54" y="35.5" class="font-base card-title">SECURITY &amp; IAM</text>

    <line x1="18" y1="56" x2="242" y2="56" stroke="#334155" stroke-width="1"/>

    <!-- Items -->
    <circle cx="28" cy="78" r="3" fill="#06b6d4"/>
    <text x="40" y="82.5" class="font-base card-item">Authentication &amp; JWT Workflows</text>

    <circle cx="28" cy="104" r="3" fill="#06b6d4"/>
    <text x="40" y="108.5" class="font-base card-item">RBAC, ABAC &amp; CBAC Policies</text>

    <circle cx="28" cy="130" r="3" fill="#06b6d4"/>
    <text x="40" y="134.5" class="font-base card-item">Multi-Tenant Isolation &amp; Guards</text>

    <circle cx="28" cy="156" r="3" fill="#06b6d4"/>
    <text x="40" y="160.5" class="font-base card-item">Attack Surface Mgmt &amp; Auditing</text>
  </g>

  <!-- Bottom Synthesis Node: Reliable & Scalable Platforms -->
  <g transform="translate(265, 395)">
    <rect x="0" y="0" width="410" height="56" rx="28" fill="#052822" stroke="#10b981" stroke-width="2.2" filter="url(#glow-strong)"/>
    <rect x="0" y="0" width="410" height="56" rx="28" fill="#052822" stroke="#10b981" stroke-width="2.2"/>
    <circle cx="32" cy="28" r="13" fill="#10b981" fill-opacity="0.25"/>
    <text x="32" y="33.5" class="font-base" font-size="14" text-anchor="middle">🚀</text>
    <text x="228" y="33.5" class="font-base output-text" text-anchor="middle">RELIABLE &amp; SCALABLE PLATFORMS</text>
  </g>
</svg>
