<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#090e1d"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f3d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1329" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="card-dist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191742" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c0d2b" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="card-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082838" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#071826" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Connector Gradients -->
    <linearGradient id="connector-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="connector-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="connector-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="bottom-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="bottom-indigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="bottom-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#334155" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 2px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 0.5px; }
    .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 11.5px; fill: #94a3b8; }
    .output-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 2px; fill: #34d399; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="448" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="448" rx="16" fill="url(#dot-grid)"/>

  <!-- Top Connectors -->
  <path d="M 450 72 C 450 100, 180 95, 180 130" fill="none" stroke="url(#connector-blue)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 450 72 L 450 130" fill="none" stroke="url(#connector-indigo)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 450 72 C 450 100, 720 95, 720 130" fill="none" stroke="url(#connector-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Bottom Connectors -->
  <path d="M 180 290 C 180 325, 450 320, 450 360" fill="none" stroke="url(#bottom-blue)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 450 290 L 450 360" fill="none" stroke="url(#bottom-indigo)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 720 290 C 720 325, 450 320, 450 360" fill="none" stroke="url(#bottom-cyan)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Top Node: Platform Engineering -->
  <g transform="translate(305, 26)">
    <rect x="0" y="0" width="290" height="46" rx="23" fill="#0b152d" stroke="#38bdf8" stroke-width="1.8" filter="url(#glow)"/>
    <rect x="0" y="0" width="290" height="46" rx="23" fill="#0b152d" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Icon -->
    <circle cx="26" cy="23" r="10" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="26" y="27.5" font-family="system-ui" font-size="12" text-anchor="middle" fill="#38bdf8">⚡</text>
    <text x="156" y="28" class="title-text" fill="#38bdf8" text-anchor="middle">PLATFORM ENGINEERING</text>
  </g>

  <!-- CARD 1: Backend Systems -->
  <g transform="translate(55, 130)">
    <rect x="0" y="0" width="250" height="160" rx="12" fill="url(#card-backend)" stroke="#3b82f6" stroke-width="1.4" stroke-opacity="0.6"/>
    <!-- Header Accent Bar -->
    <path d="M 12 0 L 238 0" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Title Area -->
    <circle cx="28" cy="28" r="12" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="28" y="32.5" font-family="system-ui" font-size="13" text-anchor="middle" fill="#60a5fa">🏗️</text>
    <text x="50" y="33" class="card-title" fill="#e2e8f0">BACKEND SYSTEMS</text>

    <!-- Divider -->
    <line x1="16" y1="50" x2="234" y2="50" stroke="#1e293b" stroke-width="1"/>

    <!-- Items -->
    <circle cx="26" cy="68" r="2.5" fill="#3b82f6"/>
    <text x="36" y="72" class="card-item">High-Throughput REST APIs</text>

    <circle cx="26" cy="89" r="2.5" fill="#3b82f6"/>
    <text x="36" y="93" class="card-item">Django / DRF &amp; Ninja Architecture</text>

    <circle cx="26" cy="110" r="2.5" fill="#3b82f6"/>
    <text x="36" y="114" class="card-item">PostgreSQL &amp; Redis Caching</text>

    <circle cx="26" cy="131" r="2.5" fill="#3b82f6"/>
    <text x="36" y="135" class="card-item">ASGI Async Execution &amp; WS</text>
  </g>

  <!-- CARD 2: Distributed Systems -->
  <g transform="translate(325, 130)">
    <rect x="0" y="0" width="250" height="160" rx="12" fill="url(#card-dist)" stroke="#6366f1" stroke-width="1.4" stroke-opacity="0.6"/>
    <!-- Header Accent Bar -->
    <path d="M 12 0 L 238 0" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Title Area -->
    <circle cx="28" cy="28" r="12" fill="#6366f1" fill-opacity="0.2"/>
    <text x="28" y="32.5" font-family="system-ui" font-size="13" text-anchor="middle" fill="#a5b4fc">🌐</text>
    <text x="50" y="33" class="card-title" fill="#e2e8f0">DISTRIBUTED SYSTEMS</text>

    <!-- Divider -->
    <line x1="16" y1="50" x2="234" y2="50" stroke="#1e293b" stroke-width="1"/>

    <!-- Items -->
    <circle cx="26" cy="68" r="2.5" fill="#6366f1"/>
    <text x="36" y="72" class="card-item">Runtime Execution &amp; Orchestration</text>

    <circle cx="26" cy="89" r="2.5" fill="#6366f1"/>
    <text x="36" y="93" class="card-item">Event-Driven Workflows</text>

    <circle cx="26" cy="110" r="2.5" fill="#6366f1"/>
    <text x="36" y="114" class="card-item">Distributed Locks &amp; Load Balancing</text>

    <circle cx="26" cy="131" r="2.5" fill="#6366f1"/>
    <text x="36" y="135" class="card-item">Fault Tolerance &amp; Observability</text>
  </g>

  <!-- CARD 3: Security & IAM -->
  <g transform="translate(595, 130)">
    <rect x="0" y="0" width="250" height="160" rx="12" fill="url(#card-sec)" stroke="#06b6d4" stroke-width="1.4" stroke-opacity="0.6"/>
    <!-- Header Accent Bar -->
    <path d="M 12 0 L 238 0" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Title Area -->
    <circle cx="28" cy="28" r="12" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="28" y="32.5" font-family="system-ui" font-size="13" text-anchor="middle" fill="#67e8f9">🔐</text>
    <text x="50" y="33" class="card-title" fill="#e2e8f0">SECURITY &amp; IAM</text>

    <!-- Divider -->
    <line x1="16" y1="50" x2="234" y2="50" stroke="#1e293b" stroke-width="1"/>

    <!-- Items -->
    <circle cx="26" cy="68" r="2.5" fill="#06b6d4"/>
    <text x="36" y="72" class="card-item">Authentication &amp; JWT Workflows</text>

    <circle cx="26" cy="89" r="2.5" fill="#06b6d4"/>
    <text x="36" y="93" class="card-item">RBAC, ABAC &amp; CBAC Policies</text>

    <circle cx="26" cy="110" r="2.5" fill="#06b6d4"/>
    <text x="36" y="114" class="card-item">Multi-Tenant Isolation &amp; Guards</text>

    <circle cx="26" cy="131" r="2.5" fill="#06b6d4"/>
    <text x="36" y="135" class="card-item">Attack Surface Mgmt &amp; Audit Logs</text>
  </g>

  <!-- Bottom Synthesis Node: Reliable & Scalable Platforms -->
  <g transform="translate(275, 360)">
    <rect x="0" y="0" width="350" height="48" rx="24" fill="#06221d" stroke="#10b981" stroke-width="1.8" filter="url(#glow)"/>
    <rect x="0" y="0" width="350" height="48" rx="24" fill="#06221d" stroke="#10b981" stroke-width="1.8"/>
    <!-- Icon -->
    <circle cx="26" cy="24" r="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="26" y="28.5" font-family="system-ui" font-size="12" text-anchor="middle" fill="#34d399">🚀</text>
    <text x="188" y="29.5" class="output-text" text-anchor="middle">RELIABLE &amp; SCALABLE PLATFORMS</text>
  </g>
</svg>
